name: CI

on:
    push:
        branches:
            - main
            - feature/file-uploader
    pull_request:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    lint-typecheck-test:
        name: Lint, typecheck and test
        runs-on: ubuntu-latest
        timeout-minutes: 8

        steps:
            - name: Checkout default branch
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint code
              run: npm run lint

            - name: Typecheck code
              run: npm run typecheck

            - name: Test client code
              run: npm run test:client

    deploy:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-latest
        needs: lint-typecheck-test
        if: github.ref == 'refs/heads/feature/file-uploader'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
